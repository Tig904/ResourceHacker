<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResourceHacker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0f24;
            overflow-x: hidden;
        }

        /* 液态流动背景 */
        .liquid-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(-45deg, #10173b, #202b70, #412886, #194775);
            background-size: 400% 400%;
            animation: liquidMove 12s ease infinite;
        }

        @keyframes liquidMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 浮动光斑 */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.45;
            z-index: 1;
        }
        .orb-1 {
            width: 320px;
            height: 320px;
            background-color: #6366f1;
            top: 8%;
            left: 12%;
            animation: float1 18s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 380px;
            height: 380px;
            background-color: #ec4899;
            bottom: 10%;
            right: 8%;
            animation: float2 22s ease-in-out infinite alternate;
        }
        @keyframes float1 {
            from { transform: translateY(0px) translateX(0px); }
            to { transform: translateY(120px) translateX(80px); }
        }
        @keyframes float2 {
            from { transform: translateY(0px) translateX(0px); }
            to { transform: translateY(-100px) translateX(-90px); }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* 头部玻璃卡片 */
        .glass-card {
            width: 100%;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 40px rgba(0,0,0,0.35);
            text-align: center;
            margin-bottom: 60px;
        }

        /* 渐变流动标题 */
        .glass-card h1 {
            font-size: clamp(2rem, 5vw, 2.8rem);
            margin-bottom: 14px;
            background: linear-gradient(90deg, #60a5fa, #f472b6, #a78bfa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientText 4s linear infinite;
        }
        @keyframes gradientText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .glass-card p.desc {
            color: rgba(255,255,255,0.72);
            font-size: 1.05rem;
            margin-bottom: 45px;
            line-height: 1.7;
        }

        /* 按钮区域 */
        .btn-wrap {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .glass-btn {
            padding: 16px 34px;
            border-radius: 14px;
            font-size: 1.08rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.32s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
        }

        .btn-trial {
            background: rgba(99, 102, 241, 0.25);
            color: #e8ecff;
        }

        .btn-pro {
            background: rgba(236, 72, 153, 0.22);
            color: #ffe8f2;
        }

        .glass-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.28);
            border-color: rgba(255,255,255,0.35);
        }

        .tip-text {
            margin-top: 28px;
            color: rgba(255,255,255,0.55);
            font-size: 0.92rem;
        }

        /* 图片展示区：图片放大 */
        .showcase-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 35px;
        }

        .showcase-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,0.14);
            overflow: hidden;
            transition: 0.4s ease;
            opacity: 0;
            transform: translateY(60px);
        }

        .showcase-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .showcase-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 45px rgba(99,102,241,0.2);
        }

        .showcase-card img {
            width: 100%;
            height: auto;
            display: block;
            transform: scale(1.04);
            transition: transform 0.5s ease;
        }

        .showcase-card:hover img {
            transform: scale(1.08);
        }

        .showcase-card .caption {
            padding: 24px;
            text-align: center;
            color: #ffffff;
            font-size: 1.18rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .showcase-wrap {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="liquid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <!-- 头部 -->
        <div class="glass-card">
            <h1>ResourceHacker</h1>
            <p class="desc">资源编辑工具 · 强大的程序资源修改软件<br>下载最新版本，欢迎赞助支持项目发展</p>

            <div class="btn-wrap">
                <a class="glass-btn btn-trial" target="_blank" href="https://wwaqw.lanzoue.com/i7btL4au05te">
                    📥 下载最新版
                </a>
                <a class="glass-btn btn-pro" target="_blank" href="https://tig904.github.io/zanzhu/">
                    💎 赞助我们
                </a>
            </div>
            <div class="tip-text">
                最新版蓝奏云密码：tig
            </div>
        </div>

        <!-- 截图展示区域 -->
        <div class="showcase-wrap">
            <div class="showcase-card">
                <img src="screen1.png" alt="简洁、可视化的页面">
                <div class="caption">简洁、可视化的页面</div>
            </div>
            <div class="showcase-card">
                <img src="screen2.png" alt="操作易懂的图标">
                <div class="caption">操作易懂的图标</div>
            </div>
            <div class="showcase-card">
                <img src="screen3.png" alt="操作便捷流畅">
                <div class="caption">操作便捷流畅</div>
            </div>
        </div>
    </div>

    <script>
        // 滚动触发渐入动画
        const cards = document.querySelectorAll('.showcase-card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(item => {
                if (item.isIntersecting) {
                    item.target.classList.add('active');
                }
            });
        }, { threshold: 0.15 });

        cards.forEach(card => observer.observe(card));
    </script>
</body>
</html>
